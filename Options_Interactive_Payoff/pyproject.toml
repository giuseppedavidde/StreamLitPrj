[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.pylint.main]
py-version = "3.14"
ignore = [".venv"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
    "too-many-locals",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-statements",
    "duplicate-code",
    "fixme",
]
